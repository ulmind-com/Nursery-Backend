[project]
name = "nursery-backend"
version = "0.1.0"
description = "Plant Nursery E-Commerce Backend — FastAPI + MongoDB"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "motor>=3.6.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "PyJWT>=2.10.1",
    "python-multipart>=0.0.20",
    "razorpay>=1.4.2",
    "requests>=2.32",
    "setuptools>=75.6.0",
    "cloudinary>=1.41.0",
    "google-auth>=2.35",
    "firebase-admin>=7.5.0",
    "xhtml2pdf>=0.2.16",
    "openpyxl>=3.1.5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
]
